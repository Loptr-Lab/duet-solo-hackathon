name: Deploy DUET review page

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "duet-review.html"
      - "review-site/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare distinct project surfaces
        run: |
          mkdir -p _site/duet
          cp duet-review.html _site/index.html
          cp review-site/* _site/
          cp -r site/. _site/duet/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload current project site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
